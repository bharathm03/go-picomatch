name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # picomatch's path semantics differ by platform, so the port is tested on
        # both rather than on Linux alone.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags conformance ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Test (race detector)
        # -race needs cgo, which is not reliably available on the Windows runner.
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Conformance report
        # Reports the parity rate without gating on it; the number is expected to
        # climb from zero as the port lands.
        run: go test -tags conformance -run 'TestConformance|TestCharacterAxis' -v ./...

      - name: Token gate
        # Not a duplicate of the step above: the token harness reports its
        # percentage the same way, but it also FAILS on any pattern the scanner
        # answered wrongly. That check is unconditional by design, and without a
        # step that runs it the design was aspirational — nothing behind the
        # conformance tag runs in CI unless a step below names it in its `-run`
        # regex.
        run: go test -tags conformance -run 'TestToken|TestCompareToken' -v ./...

      - name: Emitter gate
        # The same argument as the step above, one layer up. A harness whose name
        # is in neither of the two `-run` regexes above never runs here at all,
        # and this one localises what they cannot: tokens matching while the
        # emitted source differs is an emitter bug, not a parser bug. It fails on
        # any field an already-built branch answered wrongly, unconditionally;
        # the percentage is only a gate when PICOMATCH_EMIT_MIN is set.
        run: go test -tags conformance -run 'TestEmit|TestCompareEmit' -v ./...

      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: conformance-report
          path: |
            conformance-report.json
            emit-report.json
          if-no-files-found: warn

  upstream-integrity:
    name: Fixture integrity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The core honesty check: tests/original must match the hashes pinned when
      # it was vendored. An edit to the upstream suite fails the build instead of
      # quietly inflating the parity number.
      - name: Verify upstream test-suite hashes
        run: node tools/extract/verify.js

      # What the fixtures CAN'T see. Fails if a mutation the suite used to detect
      # now survives, if a mutation turns out to be a no-op, or if any mutation
      # escapes every fixture set. tests/original is only ever read; every edit
      # lands in a temp copy.
      - name: Fixture-set coverage (mutation harness)
        run: node tools/mutate/run.js

      # The character-axis fixtures are generated, and committed. Regenerating
      # must be a no-op: a diff here means they were hand-edited.
      - name: Character-axis fixtures are reproducible
        run: |
          node tools/charaxis/generate.js
          git diff --exit-code -- testdata/charaxis/

      # Same terms for the token fixtures. This check was described in CLAUDE.md
      # before it existed, which left testdata/tokens unpinned against generator
      # drift — and both it and the set below read the pattern corpus through
      # tools/probes/lib/corpus.js, so an edit there now has to leave two
      # committed fixture sets byte-identical or fail here.
      - name: Token fixtures are reproducible
        run: |
          node tools/tokens/generate.js
          git diff --exit-code -- testdata/tokens/

      # And for the emitter fixtures. ~1.2 MB, committed for the same reason
      # testdata/tokens is: the Go gate replays it without Node installed.
      - name: Emitter fixtures are reproducible
        run: |
          node tools/emit/generate.js
          git diff --exit-code -- testdata/emit/
